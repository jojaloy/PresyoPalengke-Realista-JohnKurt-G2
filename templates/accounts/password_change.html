{% extends 'base.html' %}
{% block title %}Change Password · PresyoPalengke{% endblock %}
{% block nav_links %}<a href="{% url 'accounts:dashboard' %}">Dashboard</a>{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Change password</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include 'accounts/_form.html' %}
    <button class="btn" type="submit">Change password</button>
    <a class="btn secondary" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
