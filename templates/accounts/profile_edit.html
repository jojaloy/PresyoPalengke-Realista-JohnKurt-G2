{% extends 'base.html' %}
{% block title %}Edit Profile · PresyoPalengke{% endblock %}
{% block nav_links %}<a href="{% url 'accounts:dashboard' %}">Dashboard</a>{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Edit profile</h1>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    {% include 'accounts/_form.html' %}
    <button class="btn" type="submit">Save changes</button>
    <a class="btn secondary" href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
</div>
{% endblock %}
