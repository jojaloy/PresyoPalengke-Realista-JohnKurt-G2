{% extends 'base.html' %}
{% block title %}Login · PresyoPalengke{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Log in</h1>
  <form method="post" novalidate>{% csrf_token %}
    {% include 'accounts/_form.html' %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="help">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
</div>
{% endblock %}
